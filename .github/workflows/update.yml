name: Update wallet data

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs by several minutes at busy times.
    - cron: '*/10 * * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # saves data to the "data" branch
  pages: write
  id-token: write

concurrency:
  group: wallet-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Saved data lives on its own "data" branch, which is replaced (not added to) each run,
      # so the repository never grows. On the very first run the history included in the
      # project (data/wallet-trades.jsonl on the main branch) is used as the starting point.
      - name: Restore saved data
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:wallet-trades.jsonl > data/wallet-trades.jsonl
            git show FETCH_HEAD:sync-state.json > data/sync-state.json || true
          fi

      - name: Fetch new trades
        env:
          RPC_HTTP_URL: ${{ secrets.RPC_URL }}
          TRACK_WALLET: ${{ vars.TRACK_WALLET }}
          SOL_USD: ${{ vars.SOL_USD }}
          KEEP_DAYS: ${{ vars.KEEP_DAYS }}
        run: npm run sync

      - name: Save data
        run: |
          rm -rf /tmp/databranch && mkdir /tmp/databranch
          cp data/wallet-trades.jsonl data/sync-state.json /tmp/databranch/
          cd /tmp/databranch
          git init -q -b data
          git config user.name "vigil-bot"
          git config user.email "vigil-bot@users.noreply.github.com"
          git add .
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Build dashboard
        env:
          TRACK_WALLET: ${{ vars.TRACK_WALLET }}
          SOL_USD: ${{ vars.SOL_USD }}
        run: npm run build-site

      # Data is already saved above. If Pages is not available (for example a private repository
      # on the free plan), these steps may fail without hiding that the data update worked.
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
